[project]
name = "autoinsight-clm-mac"
version = "0.1.0"
description = "Isolated experimental Apple Silicon runtime for CLM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "contrastive-lm==0.1.0",
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<1",
  "pytest>=8,<10",
]

[tool.uv]
package = false
# CLM declares vLLM, but this experiment injects a Transformers/MPS embedder.
# Its CPU projection heads and ranking code do not import vLLM.
override-dependencies = ["vllm; sys_platform == 'linux'"]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
